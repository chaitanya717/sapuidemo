# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: sds
type: application
framework:
  name: SAPUI5
  version: 1.147.2
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /sap/opu/odata/sap/Z_CURD_SRV
            url: http://163.223.244.16:8001
            client: '100'
            destination: SA4HANA
          - path: /sap/opu/odata/sap/ZSA_FLIGHT_LISTE_SRV
            url: http://163.223.244.16:8001
            client: '100'
            destination: SA4HANA
          - path: /sap/opu/odata/sap/ZFIRST_ODATA_SRV
            url: http://163.223.244.16:8001
            client: '100'
            destination: SA4HANA
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/Z_CURD_SRV
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZFIRST_ODATA_SRV
            metadataPath: ./webapp/localService/ZFIRST_ODATA_SRV/metadata.xml
            mockdataPath: ./webapp/localService/ZFIRST_ODATA_SRV/data
            generateMockData: true
        annotations: []
